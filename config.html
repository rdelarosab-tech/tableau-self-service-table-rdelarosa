<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar Tabla de Autoservicio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="config-body">
  <div class="config-container">
    <h2>Configurar campos disponibles</h2>
    <p class="config-subtitle">Selecciona qué campos del datasource exponer a los usuarios y clasifícalos.</p>

    <div id="config-loading" class="loading-msg">Cargando campos del datasource...</div>
    <div id="config-error" class="error-msg" style="display:none"></div>

    <div id="config-fields" style="display:none">
      <div class="worksheet-selector">
        <label for="worksheet-select">Worksheet:</label>
        <select id="worksheet-select"></select>
      </div>

      <div class="fields-panel">
        <div class="fields-column">
          <h3>Dimensiones</h3>
          <p class="col-hint">Campos categóricos (texto, fecha, etc.)</p>
          <div id="dimensions-list" class="field-checklist"></div>
        </div>
        <div class="fields-column">
          <h3>Métricas</h3>
          <p class="col-hint">Campos numéricos para agregar</p>
          <div id="metrics-list" class="field-checklist"></div>
        </div>
      </div>
    </div>

    <div class="config-actions">
      <button id="btn-cancel" class="btn btn-secondary">Cancelar</button>
      <button id="btn-save" class="btn btn-primary" disabled>Guardar</button>
    </div>
  </div>

  <script src="tableau.extensions.1.latest.js"></script>
  <script src="config.js"></script>
</body>
</html>
